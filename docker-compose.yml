services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: shopmind_user
      POSTGRES_DB: shopmind_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  

